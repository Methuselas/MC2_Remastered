# Texture Residency Registry — schema v1 (proposal, recon artifact)
# Sparse manifest: ONLY textures with a hard residency constraint get an entry.
# Anything absent defaults to class GPU_SAMPLE_ONLY (bc7 ktx2 OR tga; no CPU need).
#
# Consumed by a build-time validator (FAIL on broken invariants) and a read-only
# runtime resolver: TextureResidency::resolve(logical_name) -> entry | default.

schema_version: 1

# --- enums -------------------------------------------------------------------
residency_classes:
  - GPU_SAMPLE_ONLY            # bc7 ktx2 OR tga; no CPU pixels
  - CPU_RGBA_REQUIRED          # must keep a CPU-lockable RGBA8 source; BC7-GPU-only illegal
  - GPU_ARRAY_PLUS_CPU_ALPHA   # GL array layer + a retained CPU alpha channel
  - GPU_TILES_PLUS_CPU_FULL_ATLAS  # tiled GPU upload + retained full CPU atlas (HSV classify)
  - LOAD_TGA_THEN_GPU_KTX      # tga HARD-REQUIRED at mission load; ktx2 drawn (until keystone fix)
  - LEGACY_TGA_ONLY            # tga only; never ktx2

gpu_payload_kinds:  [ ktx2_bc7, tga, jpg_tiles, none ]
cpu_payload_kinds:  [ rgba8, raw_alpha, full_atlas, none ]

# --- entry shape -------------------------------------------------------------
entry:
  logical_name:   str        # e.g. data/textures/mat0_normal  (no extension)
  class:          residency_class
  source_semantics: str      # free tag: terrain_material_normal | mech_paint | ui | object_albedo | colormap | terrain_detail
  gpu_payload:
    kind:         gpu_payload_kind
    path:         str|null    # e.g. data/textures/mat0_normal.ktx2  (null if tga/none)
    vk_format:    int|null    # 145 BC7_UNORM | 146 BC7_SRGB
    dimensions:   "WxH"|null
    mips:         bool
    array_layer:  int|null    # for GPU_ARRAY classes
  cpu_payload:
    kind:         cpu_payload_kind
    path:         str|null    # explicit CPU sidecar, or null (derive from fallback/decode)
    channel:      str|null    # A | RGBA | RGB
  fallback:
    path:         str|null    # the .tga; null when none legal
    required:     bool        # true => validator demands it present (e.g. LOAD_TGA_THEN_GPU_KTX pre-keystone)
  consumers:      [str]       # consumer ids; must be class-consistent (validator inv #6)

# --- validator invariants (cook-time, hard fail) -----------------------------
validator:
  - id: cpu_source_exists
    rule: "class==CPU_RGBA_REQUIRED  =>  cpu_payload.kind in {rgba8} OR fallback.path is a tga/MEM_RAW-ktx2"
  - id: array_both_halves
    rule: "class==GPU_ARRAY_PLUS_CPU_ALPHA  =>  gpu_payload.path AND cpu_payload.kind==raw_alpha"
  - id: loadtga_node_source
    rule: "class==LOAD_TGA_THEN_GPU_KTX  =>  fallback.required (pre-keystone)  OR  (gpu_payload.kind==ktx2_bc7 AND node_from_ktx2_enabled)"
  - id: colormap_cpu_atlas
    rule: "class==GPU_TILES_PLUS_CPU_FULL_ATLAS  =>  NOT ktx2_only (must retain jpg/tga for HSV classify)"
  - id: no_assert_reach
    rule: "tga-absent entry  =>  loader route proven to not reach txmmgr.cpp:3669 gosASSERT"
  - id: consumer_class_agree
    rule: "no texture both in a gos_LockTexture consumer AND marked bc7-gpu-only"

# =============================================================================
# Sample entries (the six representative cases from the recon)
# =============================================================================
entries:

  - logical_name: data/tgl/128/a_hangar          # object texture, no paint
    class: GPU_SAMPLE_ONLY
    source_semantics: object_albedo
    gpu_payload: { kind: ktx2_bc7, path: data/tgl/128/a_hangar.ktx2, vk_format: 146, dimensions: "128x128", mips: false, array_layer: null }
    cpu_payload: { kind: none, path: null, channel: null }
    fallback:    { path: data/tgl/128/a_hangar.tga, required: false }
    consumers:   [ static_prop_batcher, txmmgr_generic ]
    # note: even though a_hangar renders via the static-prop batcher, its node
    # may currently need the tga at load (LOAD_TGA_THEN_GPU_KTX). Classified
    # GPU_SAMPLE_ONLY only AFTER the keystone node-from-ktx2 fix lands.

  - logical_name: data/tgl/128/madcatrgb          # mech paint mask
    class: CPU_RGBA_REQUIRED
    source_semantics: mech_paint
    gpu_payload: { kind: none, path: null, vk_format: null, dimensions: "128x128", mips: false, array_layer: null }
    cpu_payload: { kind: rgba8, path: null, channel: RGBA }   # decoded from tga; gos_LockTexture rewrites R/G/B mask
    fallback:    { path: data/tgl/128/madcatrgb.tga, required: true }
    consumers:   [ mech_paint_scheme ]   # mech3d.cpp:1825 — NEVER BC7

  - logical_name: data/art/mcui_med4              # UI atlas
    class: CPU_RGBA_REQUIRED
    source_semantics: ui
    gpu_payload: { kind: none, path: null, vk_format: null, dimensions: null, mips: false, array_layer: null }
    cpu_payload: { kind: rgba8, path: null, channel: RGBA }   # StaticInfo lock/readback for dims + button state
    fallback:    { path: data/art/mcui_med4.tga, required: true }
    consumers:   [ ui_staticinfo, control_gui ]   # utilities.cpp:226/318, controlgui.cpp:3002

  - logical_name: data/textures/wastelands.detail # terrain detail, common loader
    class: GPU_SAMPLE_ONLY
    source_semantics: terrain_detail
    gpu_payload: { kind: ktx2_bc7, path: data/textures/wastelands.detail.ktx2, vk_format: 145, dimensions: "128x128", mips: false, array_layer: null }
    cpu_payload: { kind: none, path: null, channel: null }
    fallback:    { path: data/textures/wastelands.detail.tga, required: false }
    consumers:   [ terrain_detail ]   # terrtxm2.cpp:1191 via mcTextureManager->loadTexture (BC7-eligible)

  - logical_name: data/textures/mat0_normal       # PBR splat array layer (the FAIL case)
    class: GPU_ARRAY_PLUS_CPU_ALPHA
    source_semantics: terrain_material_normal
    gpu_payload: { kind: ktx2_bc7, path: data/textures/mat0_normal.ktx2, vk_format: 145, dimensions: "2048x2048", mips: false, array_layer: 0 }
    cpu_payload: { kind: raw_alpha, path: data/textures/mat0_normal.alpha.bin, channel: A }  # cpuDispAlpha for elevation displacement
    fallback:    { path: data/textures/mat0_normal.tga, required: true }
    consumers:   [ terrain_splat_array ]
    # BLOCKED: terrtxm2.cpp:2415 reads the .tga directly + retains cpuDispAlpha.
    # Eligible only after the array builder loads a BC7 ktx2 array AND sources the
    # alpha from a cpu sidecar instead of decoding the tga.

  - logical_name: data/textures/area16.burnin     # per-map colormap (jpg variant)
    class: GPU_TILES_PLUS_CPU_FULL_ATLAS
    source_semantics: colormap
    gpu_payload: { kind: jpg_tiles, path: data/textures/area16.burnin.jpg, vk_format: null, dimensions: "4096x4096", mips: false, array_layer: null }
    cpu_payload: { kind: full_atlas, path: null, channel: RGBA }   # cpuColorMap retained for HSV terrain-type classify
    fallback:    { path: data/textures/area16.burnin.tga, required: false }
    consumers:   [ colormap_atlas, terrain_type_classify ]
    # NOT a disk target: jpg already compressed; a .burnin.ktx2 variant exists
    # (MC2_COLORMAP_KTX2) but is GPU_SAMPLE_ONLY (no CPU atlas) -> illegal here
    # because terrain_type_classify needs the CPU atlas.
